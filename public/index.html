<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SmartStore - Aqlli Telefon Sotuvchi Agent</title>
    <meta name="description" content="AI sotuvchi agent yordamida telefonlarni buyurtma qilish va boshqarish tizimi">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-container">
                <div class="logo-icon">
                    <i data-lucide="smartphone"></i>
                </div>
                <div class="logo-text">
                    <h1>SmartStore AI</h1>
                    <p>Avtomatlashtirilgan savdo va buyurtma tizimi</p>
                </div>
            </div>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="app-grid">
            <!-- Left Side: Chat Interface -->
            <section class="chat-section" aria-label="Mijoz chat oynasi">
                <div class="card chat-card">
                    <div class="card-header">
                        <div class="agent-info">
                            <div class="agent-avatar">
                                <i data-lucide="bot"></i>
                            </div>
                            <div>
                                <h3>Malika (AI Agent)</h3>
                                <p class="agent-status">Onlayn • Do'kon maslahatchisi</p>
                            </div>
                        </div>
                        <button class="btn-icon" id="clear-chat-btn" title="Chatni tozalash">
                            <i data-lucide="trash-2"></i>
                        </button>
                    </div>
                    
                    <div class="chat-messages" id="chat-messages">
                        <!-- Messages will be injected by JavaScript -->
                    </div>

                    <div class="chat-suggestions">
                        <button class="suggest-btn" data-text="Qanday telefonlar bor?">Sotuvda nimalar bor?</button>
                        <button class="suggest-btn" data-text="iPhone 15 Pro Max sotib olmoqchiman">iPhone 15 Pro Max bormi?</button>
                        <button class="suggest-btn" data-text="Menda savol bor edi">Savolim bor</button>
                    </div>

                    <form class="chat-input-area" id="chat-form">
                        <input type="text" id="chat-input" placeholder="Xabaringizni yozing (masalan: iPhone bormi?)..." autocomplete="off" required>
                        <button type="submit" class="btn btn-primary" id="send-btn">
                            <span>Yuborish</span>
                            <i data-lucide="send"></i>
                        </button>
                    </form>
                </div>
            </section>

            <!-- Right Side: DB Manager (Read-only Phone list) -->
            <section class="dashboard-section" aria-label="Tizim ma'lumotlar bazasi">
                <div class="card dashboard-card" style="height: calc(100vh - 160px); display: flex; flex-direction: column;">
                    <div class="tab-header" style="padding: 24px 24px 16px 24px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;">
                        <div>
                            <h3 style="font-size: 18px; font-weight: 600; color: var(--text-primary);">Telefonlar Ombori</h3>
                            <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Do'kondagi telefonlar qoldig'i va narxlari</p>
                        </div>
                    </div>
                    <div class="table-container" style="flex-grow: 1; overflow-y: auto; padding: 16px 24px 24px 24px;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Rasm/Model</th>
                                    <th>Narxi</th>
                                    <th>Qoldiq</th>
                                    <th>Holat</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-list">
                                <!-- Inventory items will be injected by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>






    <!-- Notification Toast -->
    <div class="toast" id="toast">
        <span id="toast-message">Muvaffaqiyatli bajarildi!</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
