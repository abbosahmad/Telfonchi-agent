<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SmartStore - Aqlli Telefon Sotuvchi Agent</title>
    <meta name="description" content="AI sotuvchi agent yordamida telefonlarni buyurtma qilish va boshqarish tizimi">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-container">
                <div class="logo-icon">
                    <i data-lucide="smartphone"></i>
                </div>
                <div class="logo-text">
                    <h1>SmartStore AI</h1>
                    <p>Avtomatlashtirilgan savdo va buyurtma tizimi</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="mode-badge simulation" id="status-badge">
                    <span class="pulse-dot"></span>
                    <span id="status-text">Simulyatsiya rejimi</span>
                </span>
                <button class="btn btn-secondary" id="open-settings-btn" title="Sozlamalar">
                    <i data-lucide="settings"></i>
                    <span>Sozlamalar</span>
                </button>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="app-grid">
            <!-- Left Side: Chat Interface -->
            <section class="chat-section" aria-label="Mijoz chat oynasi">
                <div class="card chat-card">
                    <div class="card-header">
                        <div class="agent-info">
                            <div class="agent-avatar">
                                <i data-lucide="bot"></i>
                            </div>
                            <div>
                                <h3>Malika (AI Agent)</h3>
                                <p class="agent-status">Onlayn • Do'kon maslahatchisi</p>
                            </div>
                        </div>
                        <button class="btn-icon" id="clear-chat-btn" title="Chatni tozalash">
                            <i data-lucide="trash-2"></i>
                        </button>
                    </div>
                    
                    <div class="chat-messages" id="chat-messages">
                        <!-- Messages will be injected by JavaScript -->
                    </div>

                    <div class="chat-suggestions">
                        <button class="suggest-btn" data-text="Qanday telefonlar bor?">Sotuvda nimalar bor?</button>
                        <button class="suggest-btn" data-text="iPhone 15 Pro Max sotib olmoqchiman">iPhone 15 Pro Max bormi?</button>
                        <button class="suggest-btn" data-text="Menda savol bor edi">Savolim bor</button>
                    </div>

                    <form class="chat-input-area" id="chat-form">
                        <input type="text" id="chat-input" placeholder="Xabaringizni yozing (masalan: iPhone bormi?)..." autocomplete="off" required>
                        <button type="submit" class="btn btn-primary" id="send-btn">
                            <span>Yuborish</span>
                            <i data-lucide="send"></i>
                        </button>
                    </form>
                </div>
            </section>
        </main>
    </div>



    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2><i data-lucide="sliders"></i> Tizim Sozlamalari</h2>
                <button class="btn-icon" id="close-settings-btn">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="ai-engine-select">AI Agent Turi</label>
                    <select id="ai-engine-select">
                        <option value="simulated">Simulyatsiya (Mahalliy qoidalar bilan)</option>
                        <option value="deepseek">Haqiqiy DeepSeek AI (Server API orqali)</option>
                    </select>
                    <p class="form-help">Simulyatsiya rejimi JS asosidagi sodda qoidalar bilan ishlaydi. DeepSeek esa serverdagi API orqali ishlaydi.</p>
                </div>

                <div class="form-group">
                    <label>Boshqa Amallar</label>
                    <div class="actions-row">
                        <button class="btn btn-danger" id="reset-db-btn">
                            <i data-lucide="refresh-cw"></i>
                            <span>Baza ma'lumotlarini tiklash</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancel-settings-btn">Bekor qilish</button>
                <button class="btn btn-primary" id="save-settings-btn">Saqlash</button>
            </div>
        </div>
    </div>


    <!-- Notification Toast -->
    <div class="toast" id="toast">
        <span id="toast-message">Muvaffaqiyatli bajarildi!</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
